{{ define "base" }}
<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
    th { border-bottom: 2px solid #ddd; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .breadcrumb { margin-bottom: 1rem; }
    .breadcrumb a { margin: 0 0.25rem; }
    .qr-link { font-size: 0.85rem; }
    .icon { margin-right: 0.25rem; }
    .qr-page { text-align: center; }
    .qr-image { max-width: 100%; height: auto; image-rendering: pixelated; }
    .public-url { display: inline-block; word-break: break-all; background: #f5f5f5; padding: 0.4rem 0.6rem; border-radius: 4px; }
    .qr-actions { display: flex; gap: 1rem; justify-content: center; align-items: center; }
    .site-header { display: flex; justify-content: flex-end; align-items: center; gap: 0.75rem; padding-bottom: 0.75rem; margin-bottom: 1rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .site-header form { margin: 0; }
  </style>
</head>

<body>
  <header class="site-header">
    {{ if .Username }}
    <span>Signed in as <strong>{{ .Username }}</strong></span>
    <form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
    {{ else }}
    <a href="/auth/login">Sign in</a>
    {{ end }}
  </header>

  {{ template "content" . }}
</body>

</html>
{{ end }}
